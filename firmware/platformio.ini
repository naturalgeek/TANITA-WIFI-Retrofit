; PlatformIO Project Configuration File
;
; TANITA WiFi Retrofit - ESP32 Firmware
;
; This project holds THREE separate sketches, one per subfolder:
;   tanita_spi_sniffer/  - passive bus grabber (ESP32-S3, dual SPI slave)  [recommended]
;   tanita_spi_capture/  - SD-card EMULATOR (responds as slave)            [legacy]
;   tanita_wifi/         - full WiFi retrofit emulator + HTTPS POST        [legacy]
;
; build_src_filter selects exactly one sketch per environment, so pick the env:
;   pio run -e sniffer            ; build the grabber
;   pio run -e sniffer -t upload  ; flash it
;   pio device monitor -e sniffer ; watch the capture stream (921600 baud)
;
; Pipe a capture to the decoder:
;   pio device monitor -e sniffer | tee capture.txt
;   python3 ../tools/decode_capture.py capture.txt --md ../docs/PROTOCOL_OBSERVED.md

[platformio]
src_dir = .

; ---- Passive protocol grabber (recommended) -----------------------------
[env:sniffer]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
upload_speed = 921600
build_src_filter = -<*> +<tanita_spi_sniffer/>
build_flags =
    -DCORE_DEBUG_LEVEL=3

; ---- Legacy: SD-card emulator (responder) -------------------------------
[env:capture]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = -<*> +<tanita_spi_capture/>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_ESP32_DEV

; ---- Legacy: full WiFi retrofit emulator --------------------------------
[env:wifi]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = -<*> +<tanita_wifi/>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_ESP32_DEV
